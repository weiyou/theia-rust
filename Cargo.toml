[package]
name = "theia"
version = "0.3.0"
description = "Portable MP4 streaming server with playlist mode"
authors = ["Wei You"]
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "theia"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tower-http = { version = "0.5", features = ["trace"] }
base64 = "0.21"
urlencoding = "2.1"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
html-escape = "0.2"
subtle = "2"
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }

[features]
tls = ["dep:axum-server"]

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
